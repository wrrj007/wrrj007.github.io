name: 番茄榜单每日采集

on:
  schedule:
    # GitHub Actions 使用 UTC；UTC 14:30 = 北京时间 22:30（采集到的是「前一天」的数据）
    - cron: '30 14 * * *'
    # UTC 15:00 = 北京时间 23:00，作为 22:30 那次失败时的兜底重跑（成功则自动跳过）
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      save_top:
        description: '每个榜单保存前多少本'
        required: false
        default: '40'
      detail_top:
        description: '每个榜单抓取详情的前多少本'
        required: false
        default: '30'
      keep_days:
        description: '历史数据保留天数（0=永久保留）'
        required: false
        default: '0'
      date:
        description: '数据归属日期(YYYY-MM-DD)，留空则自动推算'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fanqie-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行采集
        env:
          FANQIE_SAVE_TOP: ${{ github.event.inputs.save_top || '30' }}
          FANQIE_DETAIL_TOP: ${{ github.event.inputs.detail_top || '20' }}
          FANQIE_KEEP_DAYS: ${{ github.event.inputs.keep_days || '45' }}
          FANQIE_DATE: ${{ github.event.inputs.date }}
          # 定时任务：目标日期数据已存在则跳过（23:00 兜底重跑用）；手动触发则强制执行
          FANQIE_SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/fanqie_daily.py

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fanqie/data
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "chore(data): 番茄榜单采集 $(date -u +%Y-%m-%d)"
            git push
          fi
