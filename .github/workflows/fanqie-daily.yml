name: 番茄榜单每日采集

on:
  schedule:
    # GitHub Actions 使用 UTC；UTC 12:00 = 北京时间 19:00（采集到的是「前一天」的数据）
    - cron: '0 11 * * *'
    # UTC 14:30 = 北京时间 21:30，作为 19:00 那次失败时的兜底重跑（成功则自动跳过）
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      save_top:
        description: '每个榜单保存前多少本'
        required: false
        default: '40'
      keep_days:
        description: '历史数据保留天数（0=永久保留）'
        required: false
        default: '0'
      date:
        description: '数据归属日期(YYYY-MM-DD)，留空则自动推算'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fanqie-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Java 17（本地签名服务依赖）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动本地签名服务（详情兜底 + 作者等级）
        run: |
          cd scripts/fqsign
          nohup java -cp ".:NovelData.jar" FQSignService > /tmp/fqsign.log 2>&1 &
          echo $! > /tmp/fqsign.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8082/api/fq-sign/health | grep -q UP; then
              echo "✅ 签名服务已就绪"; exit 0
            fi
            sleep 2
          done
          echo "⚠️ 签名服务未就绪，本次将仅使用外部详情接口（作者等级可能为空）"
          tail -n 30 /tmp/fqsign.log || true

      - name: 运行采集
        env:
          FANQIE_SAVE_TOP: ${{ github.event.inputs.save_top || '40' }}
          FANQIE_KEEP_DAYS: ${{ github.event.inputs.keep_days || '0' }}
          FANQIE_DATE: ${{ github.event.inputs.date }}
          # 定时任务：目标日期数据已存在则跳过（22:30 兜底重跑用）；手动触发则强制执行
          FANQIE_SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/fanqie_daily.py

      - name: 停止签名服务
        if: always()
        run: kill $(cat /tmp/fqsign.pid) 2>/dev/null || true

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fanqie/data
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 番茄榜单采集 $(date -u +%Y-%m-%d)"
          # 检出的是「触发时刻的 SHA」：此后只要有人（或另一次定时任务）向 main 推送过，
          # 直接 push 就会因 non-fast-forward 被拒。这里 rebase 远端后重试，避免整天的数据丢失。
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ 数据已推送"
              exit 0
            fi
            echo "⚠️ 推送被拒（第 $i 次），rebase 远端后重试…"
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }
            sleep 5
          done
          echo "❌ 多次重试后仍无法推送"
          exit 1
