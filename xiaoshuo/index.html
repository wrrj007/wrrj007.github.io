<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TXT 全文搜索</title>
<link rel="stylesheet" href="js/style.css">
</head>
<body>

<header>
  <div class="bar">
    <h1>🔍 TXT 全文搜索 <span id="corpus"></span></h1>
    <form id="form" autocomplete="off">
      <input id="kw" type="search" placeholder="输入关键词，回车搜索…" enterkeyhint="search">
      <button class="primary" type="submit" id="go">搜索</button>
      <button type="button" id="cancel" hidden>取消</button>
    </form>
  </div>

  <div class="opts">
    <label>范围
      <select id="scope"><option value="">全部目录</option></select>
    </label>
    <label><input type="checkbox" id="ci" checked> 忽略英文大小写</label>
    <label><input type="checkbox" id="rx"> 正则</label>
    <label>每本最多
      <select id="cap">
        <option value="50">50 行</option>
        <option value="200" selected>200 行</option>
        <option value="500">500 行</option>
        <option value="2000">2000 行</option>
        <option value="0">不限</option>
      </select>
    </label>
    <button type="button" id="foldBtn">全部折叠</button>
  </div>

  <div class="opts">
    <label title="把文件存在本机，之后搜索不用重新下载">
      <input type="checkbox" id="useCache" checked> 本机缓存
      <span id="cacheInfo" class="muted"></span>
    </label>
    <button type="button" id="clearCache" class="mini">清空缓存</button>
    <button type="button" id="warm" class="mini" title="把这 189 本一次下载到本机，之后搜索就不用再联网（第一次要等一会儿）">缓存整个书库</button>
    <button type="button" id="pickDir" class="mini">搜索本机文件夹（不上传）</button>
    <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
  </div>

  <div id="status"></div>
  <div class="pbar" id="pbarWrap" hidden><i id="pbar"></i></div>
</header>

<main id="results">
  <div class="empty" id="hello">
    在上方输入关键词开始搜索<br>
    <small>点开某一本后，点任意一行即可在新窗口打开原文并定位到该行</small>
  </div>
</main>
<div class="tip" id="tip"></div>

<script src="js/core-util.js"></script>
<script src="js/idb.js"></script>
<script src="js/common.js"></script>
<script src="js/app.js"></script>
</body>
</html>
